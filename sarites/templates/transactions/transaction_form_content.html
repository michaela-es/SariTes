<div class="px-6 py-4 border-b border-gray-100">
    <h3 class="font-semibold text-gray-900">New Transaction</h3>
</div>
<form method="post" class="p-6" hx-post="{% url 'transactions:transaction_create' %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <div class="space-y-4">
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>{% endif %}
        </div>
        {% endfor %}
    </div>
    <div class="flex gap-2 mt-6">
        <button type="submit" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition">Save</button>
        <button type="button" onclick="closeModal('formModal')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Cancel</button>
    </div>
</form>
