{% extends 'base.html' %}
{% block title %}Transactions{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-gray-900">Transactions</h2>
    <button hx-get="{% url 'transactions:transaction_create' %}" hx-target="#formModalContent" onclick="openModal('formModal')" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition flex items-center gap-1.5">
        <i class="bi bi-plus-lg"></i> New Transaction
    </button>
</div>

{% include 'transactions/partials/_transaction_list_content.html' %}

<div id="formModal" class="fixed inset-0 z-50 hidden bg-black/40 items-center justify-center" onclick="if(event.target===this)closeModal('formModal')">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg mx-4 overflow-hidden" id="formModalContent" onclick="event.stopPropagation()"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
document.addEventListener('close-modal', function() { closeModal('formModal'); });
</script>
{% endblock %}
