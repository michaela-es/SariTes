{% extends 'base.html' %}
{% block title %}New Transaction{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5>New Transaction</h5></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'transactions:transaction_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('id_item').addEventListener('change', function() {
    const itemId = this.value;
    if (itemId) {
        fetch('/nlp-search/?q=1 ' + this.options[this.selectedIndex].text)
            .then(r => r.json())
            .then(data => {
                if (data.match) {
                    document.getElementById('id_total').value = data.item.price;
                }
            });
    }
});
</script>
{% endblock %}
