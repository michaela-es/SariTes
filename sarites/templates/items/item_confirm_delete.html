{% extends 'base.html' %}
{% block title %}Delete Item{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><h5>Confirm Delete</h5></div>
            <div class="card-body">
                <p>Delete <strong>{{ item.name }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{% url 'items:item_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
