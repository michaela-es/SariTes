<div class="overflow-x-auto rounded-xl border border-gray-200" style="max-height:55vh;overflow-y:auto">
    <table class="w-full text-xs sm:text-sm">
        <thead class="bg-gray-100 text-gray-600 uppercase text-[10px] sm:text-xs sticky top-0">
            <tr>
                <th class="text-left px-2 sm:px-4 py-2 sm:py-3">Name</th>
                <th class="text-right px-2 sm:px-4 py-2 sm:py-3">Price</th>
                <th class="text-right px-2 sm:px-4 py-2 sm:py-3">Stock</th>
                <th class="hidden sm:table-cell text-right px-2 sm:px-4 py-2 sm:py-3">Txns</th>
                <th class="text-left px-2 sm:px-4 py-2 sm:py-3">Status</th>
                <th class="text-center px-2 sm:px-4 py-2 sm:py-3 w-14 sm:w-20"></th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            {% for item in items %}
            <tr class="item-row hover:bg-gray-50" data-name="{{ item.name|lower }}" data-stock="{{ item.qty }}">
                <td class="px-2 sm:px-4 py-1.5 sm:py-2.5 font-medium truncate max-w-[100px] sm:max-w-none">{{ item.name }}</td>
                <td class="px-2 sm:px-4 py-1.5 sm:py-2.5 text-right whitespace-nowrap">₱{{ item.price }}</td>
                <td class="px-2 sm:px-4 py-1.5 sm:py-2.5 text-right">{{ item.qty }}</td>
                <td class="hidden sm:table-cell px-2 sm:px-4 py-1.5 sm:py-2.5 text-right">{{ item.tx_count }}</td>
                <td class="px-2 sm:px-4 py-1.5 sm:py-2.5">
                    <span class="inline-block px-1.5 sm:px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-medium
                        {% if item.qty == 0 %}bg-red-100 text-red-700
                        {% elif item.qty <= 10 %}bg-yellow-100 text-yellow-700
                        {% else %}bg-green-100 text-green-700{% endif %}">
                        {% if item.qty == 0 %}Out of Stock{% elif item.qty <= 10 %}Low Stock{% else %}In Stock{% endif %}
                    </span>
                </td>
                <td class="px-2 sm:px-4 py-1.5 sm:py-2.5 text-center whitespace-nowrap">
                    <button hx-get="{% url 'items:item_edit' item.pk %}" hx-target="#formModalContent" onclick="openModal('formModal')" class="text-gray-600 hover:text-gray-900 mr-1 sm:mr-2 bg-transparent border-0 cursor-pointer"><i class="bi bi-pencil text-xs sm:text-sm"></i></button>
                    <a href="#" hx-get="{% url 'items:item_delete' item.pk %}" hx-target="#formModalContent" onclick="openModal('formModal')" class="text-red-500 hover:text-red-700"><i class="bi bi-trash text-xs sm:text-sm"></i></a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="6" class="px-2 sm:px-4 py-6 sm:py-8 text-center text-gray-400">No items yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
