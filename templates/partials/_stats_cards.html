<div class="grid grid-cols-2 gap-3 content-start">
    <div class="bg-white rounded-xl border border-gray-200 p-4 text-center shadow-sm">
        <p class="text-xs text-gray-500 uppercase tracking-wide">Items</p>
        <p class="text-2xl font-bold text-gray-900 mt-1">{{ items|length }}</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-4 text-center shadow-sm">
        <p class="text-xs text-gray-500 uppercase tracking-wide">Today Sales</p>
        <p class="text-2xl font-bold text-green-600 mt-1">₱{{ today_sales|floatformat:0 }}</p>
    </div>
    <div class="col-span-2">
        <button onclick="openModal('excelModal')" class="w-full py-3 sm:py-2.5 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition text-sm flex items-center justify-center gap-2">
            <i class="bi bi-file-earmark-excel"></i> Upload Excel
        </button>
    </div>
</div>
