<div class="p-6 text-center">
    <div class="text-red-500 text-4xl mb-3"><i class="bi bi-exclamation-triangle"></i></div>
    <h3 class="font-semibold text-gray-900 mb-2">{{ title|default:"Delete?" }}</h3>
    {% if body %}<p class="text-sm text-gray-500 mb-6">{{ body }}</p>{% endif %}
    <form method="post" hx-post="{{ post_url }}" hx-swap="none" hx-disabled-elt="button[type=submit]">
        {% csrf_token %}
        <div class="flex gap-3 justify-center">
            <button type="submit" class="flex-1 sm:flex-none px-4 py-3 sm:py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition disabled:opacity-50 disabled:cursor-not-allowed">Delete</button>
            <button type="button" onclick="closeModal('formModal')" class="flex-1 sm:flex-none px-4 py-3 sm:py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Cancel</button>
        </div>
    </form>
</div>
