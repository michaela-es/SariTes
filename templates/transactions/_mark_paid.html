<form method="post" action="{% url 'transactions:mark_paid' transaction.pk %}" class="inline">
    {% csrf_token %}
    <button type="submit" class="text-xs sm:text-xs px-2 sm:px-2 py-1.5 sm:py-1 bg-green-600 text-white rounded hover:bg-green-700 transition font-medium" title="Mark Paid">
        <i class="bi bi-check-lg"></i> <span class="hidden sm:inline">Mark Paid</span>
    </button>
</form>
