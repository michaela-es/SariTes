{% extends 'base.html' %}
{% block title %}Delete Creditor{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
    <div class="bg-white rounded-xl border border-red-200 shadow-sm p-6 text-center">
        <div class="text-red-500 text-4xl mb-3"><i class="bi bi-exclamation-triangle"></i></div>
        <h3 class="font-semibold text-gray-900 mb-2">Delete {{ creditor.name }}?</h3>
        <p class="text-sm text-gray-500 mb-6">This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex gap-2 justify-center">
                <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">Delete</button>
                <a href="{% url 'creditors:creditor_list' %}" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
