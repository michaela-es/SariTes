<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items — SariTes</title>
    <link rel="icon" type="image/svg+xml" href="/static/saritessvg.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-2xl mx-auto px-4 py-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Items</h1>
            <p class="text-sm text-gray-500 mt-1">Available products and stock</p>
        </div>

        <form method="get" class="mb-6">
            <div class="relative">
                <input type="text" name="q" value="{{ query }}" placeholder="Search items..." class="w-full px-4 py-3 pl-10 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-gray-900 focus:outline-none" autofocus>
                <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                {% if query %}
                <a href="{% url 'items:public_items' %}" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"><i class="bi bi-x-lg"></i></a>
                {% endif %}
            </div>
        </form>

        <div class="space-y-2">
            {% for item in items %}
            <div class="bg-white rounded-xl border border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm">
                <div class="min-w-0 flex-1">
                    <p class="font-medium text-gray-900 truncate">{{ item.name }}</p>
                </div>
                <div class="flex items-center gap-4 shrink-0 ml-4">
                    <span class="text-sm {% if item.qty == 0 %}text-red-500{% elif item.qty <= 10 %}text-yellow-600{% else %}text-green-600{% endif %} font-semibold">
                        <i class="bi bi-box"></i> {{ item.qty }}
                    </span>
                    <span class="text-sm text-gray-900 font-semibold w-20 text-right">₱{{ item.price }}</span>
                </div>
            </div>
            {% empty %}
            <div class="text-center py-12 text-gray-400">
                <i class="bi bi-inbox text-4xl"></i>
                <p class="mt-2">No items found.</p>
            </div>
            {% endfor %}
        </div>

        <p class="text-center text-xs text-gray-400 mt-6">{{ items|length }} item{{ items|length|pluralize }}</p>
    </div>
</body>
</html>
